  --mint: #86C9A6; --mint-deep: #62B188; --sky: #8DBCE0; --lav: #B4A8E0; --butter: #EFD27A; --peach: #EFA98C; color-scheme: dark; }

tr.donor:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }

.bar > i { display: block; height: 100%; background: var(--rose); border-radius: 5px; }

.stats b { color: var(--fg); font-family: var(--font-mono); font-weight: 500; }
.note { font-size: 14px; color: var(--muted); }
.stage .note { text-align: center; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 500 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.wrap { white-space: normal; }
a { color: var(--rose); }

ol.steps li { padding: 0 0 18px 22px; position: relative; }
ol.steps li::before { content: ""; position: absolute; left: -8px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); }
ol.steps li.done::before { background: var(--mint-deep); border-color: var(--mint-deep); }

ol.steps span { display: block; color: var(--muted); font-size: 15px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.avatar { width: 96px; height: 96px; border-radius: 50%; padding: 4px; display: grid; place-items: center; font: 600 22px var(--font-display); color: var(--fg); margin-bottom: 6px; }

footer { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 18px; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .8s ease; } }

/* Scene: scalloped tree (placeholder until the final tree is chosen) with gifts piled in front of it.
   Each gift's area is proportional to its amount; the pile layout is seeded per donation, so it stays the same between visits. */
var W = 600, GROUND = 392, PILE_MAX = 165;
var TREE = '<g transform="translate(140,4) scale(1.6)">' +
  '<rect x="90" y="212" width="20" height="26" rx="3" fill="var(--peach)"/>' +

  '<path d="M100 24 L148 84 Q136 96 124 86 Q112 98 100 88 Q88 98 76 86 Q64 96 52 84 Z" fill="var(--mint)" stroke="var(--bg)" stroke-width="3" stroke-linejoin="round"/>' +
  '<polygon points="100,4 102.7,11.3 110.5,11.6 104.4,16.4 106.5,23.9 100,19.6 93.5,23.9 95.6,16.4 89.5,11.6 97.3,11.3" fill="var(--bb-gold)" stroke="var(--bg)" stroke-width="1.5" stroke-linejoin="round"/>' +
  '<circle cx="100" cy="64" r="5.5" fill="var(--bb-rose)"/><circle cx="76" cy="124" r="5.5" fill="var(--bb-sky)"/><circle cx="124" cy="124" r="5.5" fill="var(--bb-gold)"/>' +

var PAPER = ["--bb-rose", "--bb-gold", "--bb-sky", "--bb-lav", "--bb-peach", "--mint-deep", "--rose-soft", "--sky"];
var RIBBON = ["--rose", "--bb-gold", "--surface", "--mint-deep", "--bb-lav"];

function rng(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function layoutGifts(list) {
  if (!list.length) return [];
  var sky = [], x, c;
  for (x = 0; x < W; x++) sky[x] = GROUND;
  var maxAmt = Math.max.apply(null, list.map(function (d) { return d.amount; }));
  var sum = list.reduce(function (a, d) { return a + d.amount; }, 0);
  var k = Math.min(55 / Math.sqrt(20000), 100 / Math.sqrt(maxAmt), Math.sqrt(0.4 * (W - 100) * PILE_MAX / sum));
  return list.map(function (d, i) {
    var r = rng(i * 7919 + d.amount);
    var side = Math.max(16, k * Math.sqrt(d.amount));
    var asp = 0.78 + r() * 0.55;
    var w = Math.max(14, Math.round(side * asp)), h = Math.max(14, Math.round(side / asp));
    var best = null;
    for (var t = 0; t < 60; t++) {
      x = Math.round(50 + r() * (W - 100 - w));
      var rest = GROUND;
      for (c = x; c < x + w; c++) rest = Math.min(rest, sky[c]);
      var sup = 0;
      for (c = x; c < x + w; c++) if (sky[c] - rest < 3) sup++;
      if (rest < GROUND && sup / w < 0.6) continue;
      if (GROUND - rest + h > PILE_MAX) continue;
      var score = rest + r() * 28 - Math.abs(x + w / 2 - W / 2) * 0.05;
      if (!best || score > best.score) best = { x: x, y: rest - h, score: score };
    }
    if (!best) { x = Math.round(50 + r() * (W - 100 - w)); best = { x: x, y: GROUND - h }; }
    for (c = best.x; c < best.x + w; c++) sky[c] = Math.min(sky[c], best.y);
    var paper = PAPER[Math.floor(r() * PAPER.length)], ribbon = RIBBON[Math.floor(r() * RIBBON.length)];
    if (ribbon === paper) ribbon = "--surface";
    return { i: i, x: best.x, y: best.y, w: w, h: h, style: Math.floor(r() * 6), paper: paper, ribbon: ribbon };
  });
}

function rect(x, y, w, h, fill, extra) {
  return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + Math.max(0, w).toFixed(1) + '" height="' + Math.max(0, h).toFixed(1) + '" fill="' + fill + '"' + (extra || "") + "/>";
}
function bow(cx, y, w, fill) {
  var a = Math.max(4, w * 0.16), b = Math.max(3, w * 0.1);
  return '<ellipse cx="' + (cx - a * 0.8).toFixed(1) + '" cy="' + (y - b * 0.7).toFixed(1) + '" rx="' + a.toFixed(1) + '" ry="' + b.toFixed(1) + '" fill="' + fill + '"/>' +
         '<ellipse cx="' + (cx + a * 0.8).toFixed(1) + '" cy="' + (y - b * 0.7).toFixed(1) + '" rx="' + a.toFixed(1) + '" ry="' + b.toFixed(1) + '" fill="' + fill + '"/>' +
         '<circle cx="' + cx.toFixed(1) + '" cy="' + (y - b * 0.3).toFixed(1) + '" r="' + (b * 0.7).toFixed(1) + '" fill="' + fill + '"/>';
}

/* Six wrapping styles: classic ribbon, stripes, dots, lid, string-tied, two-tone band. */
function giftShape(g, label) {
  var x = g.x, y = g.y, w = g.w, h = g.h, cx = x + w / 2;
  var P = "var(" + g.paper + ")", R = "var(" + g.ribbon + ")", rw = Math.max(3, w * 0.12), s = "";
  s += rect(x, y, w, h, P, ' rx="2" class="body"');
  if (g.style === 0) {
    s += rect(cx - rw / 2, y, rw, h, R) + rect(x, y + h * 0.42 - rw / 2, w, rw, R) + bow(cx, y, w, R);
  } else if (g.style === 1) {
    for (var sx = x + w / 8; sx < x + w - 2; sx += w / 4) s += rect(sx, y, w / 9, h, "var(--surface)", ' opacity=".45"');
    s += rect(x, y + h * 0.5 - rw / 2, w, rw, R) + bow(cx, y, w * 0.8, R);
  } else if (g.style === 2) {
    var step = Math.max(6, Math.min(w, h) / 4);
    for (var dy = y + step / 2; dy < y + h - 2; dy += step)
      for (var dx = x + step / 2; dx < x + w - 2; dx += step)
        s += '<circle cx="' + dx.toFixed(1) + '" cy="' + dy.toFixed(1) + '" r="' + (step * 0.14).toFixed(1) + '" fill="var(--surface)" opacity=".75"/>';
    s += rect(cx - rw / 2, y, rw, h, R) + bow(cx, y, w, R);
  } else if (g.style === 3) {
    var lid = Math.max(5, h * 0.22);
    s += rect(x - 2, y, w + 4, lid, R, ' rx="2"') + rect(cx - rw / 2, y + lid, rw, h - lid, R, ' opacity=".7"') + bow(cx, y, w * 0.8, R);
  } else if (g.style === 4) {
    s += '<path d="M' + cx.toFixed(1) + " " + y.toFixed(1) + " V" + (y + h).toFixed(1) + " M" + x.toFixed(1) + " " + (y + h / 2).toFixed(1) + " H" + (x + w).toFixed(1) +
         '" stroke="' + R + '" stroke-width="2" fill="none"/>' +
         '<circle cx="' + (cx - 4).toFixed(1) + '" cy="' + (y - 3).toFixed(1) + '" r="4" fill="none" stroke="' + R + '" stroke-width="2"/>' +
         '<circle cx="' + (cx + 4).toFixed(1) + '" cy="' + (y - 3).toFixed(1) + '" r="4" fill="none" stroke="' + R + '" stroke-width="2"/>' +
         '<circle cx="' + cx.toFixed(1) + '" cy="' + (y - 1).toFixed(1) + '" r="2.6" fill="' + R + '"/>';
  } else {
    s += rect(x, y + h * 0.55, w, h * 0.45, R, ' opacity=".55"') + rect(x, y + h * 0.55 - rw / 2, w, rw, R) + bow(cx, y, w * 0.9, R);
  }
  return '<g class="gift" data-i="' + g.i + '" tabindex="0" role="button" aria-label="' + esc(label) + '"><title>' + esc(label) + "</title>" + s + "</g>";
}

var hover = null, pinned = null;
function applyHL() {
  var on = hover !== null ? hover : pinned;
  var scene = $("scene");
  scene.classList.toggle("has-hl", on !== null);
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function (el) {
    el.classList.toggle("hl", on !== null && +el.getAttribute("data-i") === on);
  });
}
function pin(i, from) {
  pinned = pinned === i ? null : i;
  applyHL();
  if (pinned === null) return;
  var target = from === "gift" ? document.querySelector('tr[data-i="' + i + '"]') : $("scene");
  if (target && target.scrollIntoView) target.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function wire(el, i, from) {
  el.addEventListener("mouseenter", function () { hover = i; applyHL(); });
  el.addEventListener("mouseleave", function () { hover = null; applyHL(); });
  el.addEventListener("focus", function () { hover = i; applyHL(); });
  el.addEventListener("blur", function () { hover = null; applyHL(); });
  el.addEventListener("click", function () { pin(i, from); });
  el.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pin(i, from); } });
}

  var b = this;

});
